name: Descargar y extraer 102 PDF
on:
  push:
    paths:
      - scripts/descargar_pdf102.py
      - .github/workflows/descargar-pdf102.yml
  workflow_dispatch:
jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar extractor PDF
        run: pip install pymupdf
      - name: Regenerar listado OpenAlex desde los 355 registros del repositorio
        run: |
          python scripts/recuperar_textos.py
          mkdir -p data
          cp outputs/enlaces_texto_completo.csv data/enlaces_texto_completo.csv
      - name: Descargar PDF y extraer contenido
        run: python scripts/descargar_pdf102.py
      - name: Guardar textos y registro de resultados
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: textos-pdf102-extraidos
          path: outputs/pdf102/
          retention-days: 14
